services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calenmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calenmate}
      POSTGRES_DB: ${POSTGRES_DB:-calenmate}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      TZ: Asia/Seoul
      DATABASE_URL: postgres://${POSTGRES_USER:-calenmate}:${POSTGRES_PASSWORD:-calenmate}@db:5432/${POSTGRES_DB:-calenmate}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      FRONTEND_URL: http://localhost:${APP_PORT:-3000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:4000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
